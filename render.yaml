# Render 部署配置 —— 后端 Fastify + SQLite(持久盘)
# 文档: https://render.com/docs/blueprint-spec
#
# 部署步骤:
#   1. 把本仓库推到 GitHub
#   2. Render 控制台 -> New -> Blueprint -> 选中本 repo,Render 会自动识别本文件
#   3. 首次部署后,把服务公网地址(形如 https://game-api.onrender.com)填到前端 Vercel 的 VITE_API_BASE
services:
  - type: web
    name: game-api
    runtime: node
    plan: free
    # monorepo: 仅安装 api 及其 workspace 依赖,再构建 game-core 与 api
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --filter @game/api... &&
      pnpm --filter @game/game-core build &&
      pnpm --filter @game/api build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # SQLite 落在持久盘上,重启不丢数据
      - key: DB_PATH
        value: /var/data/life.db
      # 部署后改成你的 Vercel 前端域名,收紧跨域(可逗号分隔多个)
      # - key: CORS_ORIGINS
      #   value: https://your-game.vercel.app
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
