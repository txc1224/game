name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的 Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署,正在进行的部署不取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @game/game-core build
          pnpm --filter @game/mud-core build
          pnpm --filter @game/card-core build
          pnpm --filter @game/inn-core build

      # 各 app 部署到 Pages 下的子路径,合集页在根
      - name: Build portal (base=/game/)
        run: pnpm --filter @game/portal build
        env:
          VITE_BASE: /game/

      - name: Build life-restart (base=/game/life-restart/)
        run: pnpm --filter @game/life-restart build
        env:
          VITE_BASE: /game/life-restart/

      - name: Build wulin-mud (base=/game/wulin-mud/)
        run: pnpm --filter @game/wulin-mud build
        env:
          VITE_BASE: /game/wulin-mud/

      - name: Build card-rogue (base=/game/card-rogue/)
        run: pnpm --filter @game/card-rogue build
        env:
          VITE_BASE: /game/card-rogue/

      - name: Build wuxia-inn (base=/game/wuxia-inn/)
        run: pnpm --filter @game/wuxia-inn build
        env:
          VITE_BASE: /game/wuxia-inn/

      # 组装站点:根=合集页,子目录=各游戏
      - name: Assemble site
        run: |
          mkdir -p public/life-restart public/wulin-mud public/card-rogue public/wuxia-inn
          cp -r apps/portal/dist/* public/
          cp -r apps/life-restart/dist/* public/life-restart/
          cp -r apps/wulin-mud/dist/* public/wulin-mud/
          cp -r apps/card-rogue/dist/* public/card-rogue/
          cp -r apps/wuxia-inn/dist/* public/wuxia-inn/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
